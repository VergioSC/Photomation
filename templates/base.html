<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Photomation{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <nav class="nav">
    <div class="wrap nav-inner">
      <a class="brand" href="{{ url_for('landing') }}">
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
          <!-- Bracket-frame camera: a thin viewfinder with heavy rules
               bracketing two opposite corners, the lens lit, and the shutter
               button sitting proud of the top-right as a single pixel. -->
          <rect x="5.5" y="5.5" width="13" height="13" fill="none"
                stroke="currentColor" stroke-width="1"/>
          <path d="M12 3.6h8.4V6H12z M18 3.6h2.4v8.4H18z" fill="currentColor"/>
          <path d="M3.6 12H6v8.4H3.6z M3.6 18H12v2.4H3.6z" fill="currentColor"/>
          <circle cx="12" cy="12" r="3" fill="none"
                  stroke="var(--volt)" stroke-width="2"/>
          <rect x="21.2" y="0.8" width="2.4" height="2.4" fill="var(--volt)"/>
        </svg>
        <span>Photomation</span>
      </a>
      <div class="nav-links">
        <a href="{{ url_for('landing') }}" {% if active == 'home' %}class="active"{% endif %}>Overview</a>
        <a href="{{ url_for('dashboard') }}" {% if active == 'dashboard' %}class="active"{% endif %}>Dashboard</a>
        <a href="{{ url_for('grade_page') }}" {% if active == 'grade' %}class="active"{% endif %}>Edit</a>
      </div>
    </div>
  </nav>

  {% block content %}{% endblock %}

  <footer class="footer">
    <div class="wrap">
      <p>PHOTOMATION v1 // blur-based culling + grading // your photos never leave this machine</p>
    </div>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
