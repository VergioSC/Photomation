<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The page first, then the app: a pinned tab shows the start of the
       title, so "Cull" is more use there than a fourth copy of "Photomation". -->
  <title>{% block title %}Photomation{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="mask-icon" href="{{ url_for('static', filename='favicon.svg') }}" color="#29abe2">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <nav class="nav">
    <div class="wrap nav-inner">
      <a class="brand" href="{{ url_for('landing') }}">
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
          <!-- Camera body drawn as one outline, lens filled in the accent, and
               the shutter button detached above the top-right corner. -->
          <path d="M1.6 19.4V7.2h6.15l0.7-1.8h4.1l0.7 1.8h6.15v12.2z"
                fill="none" stroke="currentColor" stroke-width="1.9"
                stroke-linejoin="round" stroke-linecap="round"/>
          <circle cx="10.5" cy="13.4" r="4.1" fill="var(--volt)"/>
          <rect x="17.4" y="0.8" width="3.6" height="3.6" fill="var(--volt)"/>
        </svg>
        <span>Photomation</span>
      </a>
      <div class="nav-links">
        <a href="{{ url_for('landing') }}" {% if active == 'home' %}class="active"{% endif %}>Overview</a>
        <a href="{{ url_for('dashboard') }}" {% if active == 'dashboard' %}class="active"{% endif %}>Cull</a>
        <a href="{{ url_for('grade_page') }}" {% if active == 'grade' %}class="active"{% endif %}>Edit</a>
      </div>
    </div>
  </nav>

  {% block content %}{% endblock %}

  <footer class="footer">
    <div class="wrap">
      <p>PHOTOMATION v1 // blur-based culling + grading // your photos never leave this machine</p>
    </div>
  </footer>
  <!-- One dialog for the whole app. Native <dialog> so Escape, focus trapping
       and the backdrop come from the browser rather than from us. -->
  <dialog class="ask" id="ask">
    <h3 id="ask-title"></h3>
    <p id="ask-body"></p>
    <div class="ask-actions" id="ask-actions"></div>
  </dialog>
  <script>
    /* ask("Title", "What is at stake", ["Do it", "Cancel"]) -> the label the
       person clicked, or null if they dismissed it with Escape. The LAST
       button is the safe one: it gets focus, and Escape picks it. */
    window.ask = (title, body, labels) => new Promise((resolve) => {
      const box = document.getElementById("ask");
      document.getElementById("ask-title").textContent = title;
      document.getElementById("ask-body").textContent = body;
      const actions = document.getElementById("ask-actions");
      actions.replaceChildren();
      let answer = null;
      labels.forEach((label, i) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "btn btn-small" + (i === labels.length - 1 ? " btn-secondary" : "");
        b.textContent = label;
        b.addEventListener("click", () => { answer = label; box.close(); });
        actions.append(b);
      });
      box.addEventListener("close", () => resolve(answer), { once: true });
      box.showModal();
      actions.lastElementChild?.focus();
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
