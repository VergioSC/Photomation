<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photomation</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <link rel="mask-icon" href="{{ url_for('static', filename='favicon.svg') }}" color="#29abe2">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <nav class="nav">
    <div class="wrap nav-inner">
      <a class="brand" href="{{ url_for('landing') }}">
        <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
          <!-- Camera body drawn as one outline, lens filled in the accent, and
               the shutter button detached above the top-right corner. -->
          <path d="M1.6 19.4V7.2h6.15l0.7-1.8h4.1l0.7 1.8h6.15v12.2z"
                fill="none" stroke="currentColor" stroke-width="1.9"
                stroke-linejoin="round" stroke-linecap="round"/>
          <circle cx="10.5" cy="13.4" r="4.1" fill="var(--volt)"/>
          <rect x="17.4" y="0.8" width="3.6" height="3.6" fill="var(--volt)"/>
        </svg>
        <span>Photomation</span>
      </a>
      <div class="nav-links">
        <a href="{{ url_for('landing') }}" {% if active == 'home' %}class="active"{% endif %}>Overview</a>
        <a href="{{ url_for('dashboard') }}" {% if active == 'dashboard' %}class="active"{% endif %}>Dashboard</a>
        <a href="{{ url_for('grade_page') }}" {% if active == 'grade' %}class="active"{% endif %}>Edit</a>
      </div>
    </div>
  </nav>

  {% block content %}{% endblock %}

  <footer class="footer">
    <div class="wrap">
      <p>PHOTOMATION v1 // blur-based culling + grading // your photos never leave this machine</p>
    </div>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
